<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard</title>

  <style>
    :root{
      --bg0:#060B1A;
      --text:#EAF1FF;
      --muted:#AFC2F2;
      --accent:#38BDF8;
      --accent2:#2DD4BF;
      --ring:rgba(56,189,248,.35);
      --border:rgba(255,255,255,.10);
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --radius: 18px;

      /* Desktop “panel height” control */
      --panel-h: 460px; /* adjust if you want a shorter/taller dashboard row */
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(1000px 700px at 20% -10%, rgba(56,189,248,.25), transparent 60%),
        radial-gradient(900px 700px at 95% 10%, rgba(45,212,191,.18), transparent 55%),
        linear-gradient(180deg, var(--bg0), #030611 70%);
    }

    .texture{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.22;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(700px 550px at 35% 15%, black 25%, transparent 70%);
    }

    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      min-height: 100vh;            /* ensures footer stays visible */
      display:flex;
      flex-direction:column;
      padding: 22px 16px 18px;
    }

    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin: 8px 0 18px;
    }

    .title h1{
      margin:0;
      font-size: 22px;
      letter-spacing:.2px;
    }
    .title p{
      margin:6px 0 0;
      color:var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    /* Main content grows, footer stays at bottom */
    main{
      flex: 1 1 auto;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    /* Desktop: side by side, equal-height row */
    @media (min-width: 860px){
      .grid{
        grid-template-columns: 1.1fr 1.6fr;
        align-items: stretch; /* important: makes cards match height */
      }
      .card{
        height: var(--panel-h);
      }
    }

    .card{
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow:hidden;

      /* Make internal layout controllable */
      display:flex;
      flex-direction:column;
      min-height: 0;
    }

    .card-inner{
      padding: 16px;
      flex: 0 0 auto;
    }

    .card h2{
      margin:0 0 6px;
      font-size: 15px;
      letter-spacing:.2px;
    }
    .card .sub{
      margin:0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    /* Link tree: scroll within card if too many links */
    .links{
      display:flex;
      flex-direction:column;
      gap:10px;

      /* Fill remaining height on desktop */
      flex: 1 1 auto;
      min-height: 0;
      overflow:auto;
      padding: 0 16px 16px;
    }

    /* Keep padding consistent with .card-inner */
    .links-pad{
      padding: 0 16px 16px;
    }

    .link{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 12px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(8, 18, 45, .55);
      text-decoration:none;
      color: var(--text);
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .link:hover{
      transform: translateY(-1px);
      border-color: rgba(56,189,248,.35);
      box-shadow: 0 0 0 6px var(--ring);
    }
    .link .label{
      display:flex; flex-direction:column; gap:2px;
      min-width:0;
    }
    .link .label strong{
      font-size: 14px;
      font-weight: 650;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .link .label span{
      font-size: 12px;
      color: var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .arrow{
      width: 34px; height: 34px;
      border-radius: 12px;
      display:grid; place-items:center;
      background: linear-gradient(135deg, rgba(56,189,248,.25), rgba(45,212,191,.18));
      border: 1px solid rgba(255,255,255,.10);
      flex: 0 0 auto;
    }

    /* Radar: make smaller vertically and avoid pushing layout */
    .media{
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.20);

      /* Fill remaining card height */
      flex: 1 1 auto;
      min-height: 0;

      display:flex;
      align-items:stretch;
    }

    .media img{
      width: 100%;
      height: 100%;
      object-fit: cover; /* trims vertical space nicely */
      display:block;
    }

    .meta-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 10px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: 12px;
      text-decoration:none;
    }
    .pill:hover{ border-color: rgba(56,189,248,.30); }

    footer{
      margin-top: 14px;
      padding: 8px 0 2px;
      color: rgba(234,241,255,.85);
      font-size: 12px;
      text-align:center;
    }
  </style>
</head>

<body>
  <div class="texture"></div>

  <div class="wrap">
    <header>
      <div class="title">
        <h1>Dashboard</h1>
        <p>Quick links + Northeast radar loop.</p>
      </div>
    </header>

    <main>
      <div class="grid">
        <!-- Link Tree -->
        <section class="card">
          <div class="card-inner">
            <h2>Links</h2>
            <p class="sub">Your personal “link tree” for daily stuff.</p>
          </div>

          <div class="links links-pad">
            <a class="link" href="https://mail.google.com" target="_blank" rel="noreferrer">
              <div class="label">
                <strong>Mail</strong>
                <span>Inbox</span>
              </div>
              <div class="arrow" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M7 17L17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
            </a>

            <a class="link" href="https://calendar.google.com" target="_blank" rel="noreferrer">
              <div class="label">
                <strong>Calendar</strong>
                <span>What’s next</span>
              </div>
              <div class="arrow" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M7 17L17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
            </a>

            <a class="link" href="https://www.trello.com" target="_blank" rel="noreferrer">
              <div class="label">
                <strong>Projects</strong>
                <span>Trello / Notion / whatever</span>
              </div>
              <div class="arrow" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M7 17L17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
            </a>

            <!-- Add more links; this section will scroll inside the card if it gets long -->
          </div>
        </section>

        <!-- Radar -->
        <section class="card">
          <div class="card-inner">
            <h2>NWS Radar · Northeast</h2>
            <p class="sub">Animated loop (cropped to fit the dashboard).</p>

            <div class="meta-row">
              <a class="pill" href="https://radar.weather.gov/region/northeast/standard" target="_blank" rel="noreferrer">
                Open interactive radar
              </a>
            </div>
          </div>

          <div class="media">
            <img
              src="https://radar.weather.gov/ridge/standard/NORTHEAST_loop.gif"
              alt="National Weather Service Northeast regional radar loop"
              loading="lazy"
            />
          </div>
        </section>
      </div>
    </main>

    <footer>Capt Thrams 2026</footer>
  </div>
</body>
</html>
