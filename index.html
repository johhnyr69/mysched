<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Johnny’s Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --spotlight-orange: #ff6600; /* JetBlue "Spotlight" accent */
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.15);
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif;
  background: radial-gradient(circle at top, #0a2342, #020b18);
  color: #fff;
}

header {
  text-align: center;
  padding: 24px;
  font-size: 1.7rem;
  font-weight: 600;
  background: linear-gradient(135deg, #1a1a1a, var(--spotlight-orange));
  border-bottom: 1px solid var(--border);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  padding: 18px;
  height: calc(100vh - 150px);
  box-sizing: border-box;
}

.panel {
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,.4);
  overflow: hidden;
  border: 1px solid var(--border);
  backdrop-filter: blur(14px);
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

footer {
  margin: 0 18px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--spotlight-orange), #ff9933);
  padding: 14px 20px;
  text-align: center;
  font-size: 1.1rem;
  font-weight: 500;
  box-shadow: 0 12px 25px rgba(0,0,0,.4);
}
</style>
</head>

<body>

<header>
Hello 👋 — Welcome to Johnny’s Live Dashboard
</header>

<div class="grid">

  <!-- ADS-B Exchange Flight Map (New England) -->
  <div class="panel">
    <iframe 
      src="https://globe.adsbexchange.com/?icao=&lat=42.5&lng=-71&zoom=6" 
      loading="lazy">
    </iframe>
  </div>

  <!-- NOAA Weather Radar -->
  <div class="panel">
    <iframe 
      src="https://radar.weather.gov" 
      loading="lazy">
    </iframe>
  </div>

</div>

<footer id="verse"></footer>

<script>
const verses = [
  "“The Lord is my shepherd; I shall not want.” — Psalm 23:1",
  "“For I know the plans I have for you…” — Jeremiah 29:11",
  "“Be still, and know that I am God.” — Psalm 46:10",
  "“Trust in the Lord with all your heart.” — Proverbs 3:5",
  "“The Lord will watch over your coming and going.” — Psalm 121:8",
  "“I can do all things through Christ who strengthens me.” — Philippians 4:13"
];

function setVerse() {
  const v = verses[Math.floor(Math.random() * verses.length)];
  document.getElementById("verse").textContent = v;
}

setVerse();
setInterval(setVerse, 60000); // rotate every minute
</script>

</body>
</html>
