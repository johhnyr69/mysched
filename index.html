<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capt Thrams Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --jb-blue:#2aa7df;
  --jb-light:#eaf6fd;
  --jb-dark:#0c4a6e;
}

body{
  margin:0;
  background:linear-gradient(180deg,#f4fbff,#dff2fb);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:#06324a;
}

header{
  text-align:center;
  padding:30px 10px 10px;
}

header h1{
  margin:0;
  font-size:2.6rem;
  color:var(--jb-dark);
  letter-spacing:.04em;
}

.grid{
  max-width:1100px;
  margin:40px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  padding:0 25px;
}

.card{
  background:white;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  overflow:hidden;
  border:1px solid #d0ecfb;
}

.card h2{
  margin:0;
  padding:14px 20px;
  background:linear-gradient(90deg,var(--jb-blue),#7fd3ff);
  color:white;
  font-weight:600;
  letter-spacing:.05em;
  text-align:center;
}

.card iframe{
  width:100%;
  height:480px;
  border:none;
}

/* links */
.links{
  padding:20px;
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.links a{
  text-decoration:none;
  background:var(--jb-light);
  color:var(--jb-dark);
  padding:14px 18px;
  border-radius:14px;
  font-weight:600;
  text-align:center;
  transition:.2s ease;
  border:1px solid #cfe9f8;
}

.links a:hover{
  background:#d4f0ff;
  transform:translateY(-2px);
}
</style>
</head>

<body>

<header>
  <h1>Capt Thrams Dashboard</h1>
</header>

<div class="grid">

  <!-- LINKS -->
  <div class="card">
    <h2>Quick Links</h2>
    <div class="links">
      <a href="https://www.flightaware.com" target="_blank">FlightAware</a>
      <a href="https://radar.weather.gov" target="_blank">NOAA Radar</a>
      <a href="https://www.windy.com" target="_blank">Windy</a>
      <a href="https://www.marinetraffic.com" target="_blank">Marine Traffic</a>
      <a href="https://www.weather.gov/okx/" target="_blank">NWS New York</a>
    </div>
  </div>

  <!-- RADAR -->
  <div class="card">
    <h2>Live Weather Radar</h2>
    <iframe src="https://radar.weather.gov/ridge/standard/KOKX_loop.gif"></iframe>
  </div>

</div>

</body>
</html>
