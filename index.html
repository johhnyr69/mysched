<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capt Thrams Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --jb-blue:#1f8fc7;
  --jb-light:#d7effb;
  --jb-dark:#083a5a;
}

*{
  box-sizing:border-box;
}

html, body{
  height:100%;
  margin:0;
}

body{
  background:linear-gradient(180deg,#d9f1fb 0%, #b9e2f5 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--jb-dark);
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  padding:28px 12px 10px;
}

header h1{
  margin:0;
  font-size:2.6rem;
  color:var(--jb-dark);
  letter-spacing:.05em;
}

.main{
  flex:1;
  display:flex;
  align-items:stretch;
  justify-content:center;
}

.grid{
  width:100%;
  max-width:1200px;
  padding:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.card{
  background:white;
  border-radius:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.12);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border:1px solid #bcdff2;
}

.card h2{
  margin:0;
  padding:16px;
  background:linear-gradient(90deg,var(--jb-blue),#4bb7ee);
  color:white;
  font-weight:600;
  text-align:center;
  letter-spacing:.05em;
}

.card iframe{
  flex:1;
  width:100%;
  border:none;
}

/* links */
.links{
  padding:22px;
  display:grid;
  gap:16px;
}

.links a{
  text-decoration:none;
  background:linear-gradient(180deg,#eaf6fd,#cdeafb);
  color:var(--jb-dark);
  padding:16px;
  border-radius:14px;
  font-weight:600;
  text-align:center;
  border:1px solid #b7def3;
  transition:.2s ease;
}

.links a:hover{
  background:linear-gradient(180deg,#ffffff,#e2f4ff);
  transform:translateY(-2px);
}
</style>
</head>

<body>

<header>
  <h1>Capt Thrams Dashboard</h1>
</header>

<div class="main">
  <div class="grid">

    <!-- LINKS -->
    <div class="card">
      <h2>Quick Links</h2>
      <div class="links">
        <a href="https://www.flightaware.com" target="_blank">FlightAware</a>
        <a href="https://radar.weather.gov" target="_blank">NOAA Radar</a>
        <a href="https://www.windy.com" target="_blank">Windy</a>
        <a href="https://www.marinetraffic.com" target="_blank">Marine Traffic</a>
        <a href="https://www.weather.gov/okx/" target="_blank">NWS New York</a>
      </div>
    </div>

    <!-- RADAR -->
    <div class="card">
      <h2>Live Weather Radar</h2>
      <iframe src="https://radar.weather.gov/ridge/standard/KOKX_loop.gif"></iframe>
    </div>

  </div>
</div>

</body>
</html>
