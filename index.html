<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0b1220;
  color: #ffffff;
}

header {
  text-align: center;
  padding: 20px;
  background: linear-gradient(135deg,#162447,#1f4068);
  font-size: 1.5rem;
  font-weight: 600;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: calc(100vh - 140px);
}

.panel {
  border: 1px solid rgba(255,255,255,.1);
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

footer {
  text-align: center;
  padding: 15px;
  font-size: 1.1rem;
  background: #111;
  border-top: 1px solid rgba(255,255,255,.1);
}
</style>
</head>

<body>

<header>
Hello 👋 — Welcome to Evans Live Dashboard
</header>

<div class="grid">

  <!-- Flight Radar -->
   <div class="panel">
    <iframe 
      src="https://flightaware.com/live/map" 
      loading="lazy">
    </iframe>
  </div>

  <!-- NOAA Weather Radar -->
  <div class="panel">
    <iframe src="https://radar.weather.gov"></iframe>
  </div>

</div>

<footer id="verse">
</footer>

<script>
const verses = [
  "“The Lord is my shepherd; I shall not want.” — Psalm 23:1",
  "“For I know the plans I have for you…” — Jeremiah 29:11",
  "“Be still, and know that I am God.” — Psalm 46:10",
  "“Trust in the Lord with all your heart.” — Proverbs 3:5",
  "“The Lord will watch over your coming and going.” — Psalm 121:8",
  "“I can do all things through Christ who strengthens me.” — Philippians 4:13"
];

function setVerse() {
  const v = verses[Math.floor(Math.random() * verses.length)];
  document.getElementById("verse").textContent = v;
}

setVerse();
setInterval(setVerse, 60000); // rotate every minute
</script>

</body>
</html>
