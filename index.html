<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Johnny’s Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  /* JetBlue Tail-inspired colors */
  --blue-dark: #002b5c;
  --blue-mid: #005DAA;
  --blue-light: #4FA9FF;
  --orange-accent: #FF7F32;
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.15);
}

/* Base styles */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif;
  background: radial-gradient(circle at top, var(--blue-dark), #020b18);
  color: #ffffff;
  overflow-x: hidden;
}

/* Header */
header {
  text-align: center;
  padding: 24px;
  font-size: 1.7rem;
  font-weight: 600;
  background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
  border-bottom: 2px solid var(--orange-accent);
  border-radius: 0 0 20px 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,.5);
  animation: fadeInUp 1s ease forwards;
  opacity: 0;
}

/* Grid for panels */
.grid {
  display: grid;
  gap: 20px;
  padding: 20px;
  height: calc(100vh - 150px);
  box-sizing: border-box;
  grid-template-columns: 1fr; /* mobile first: stack vertically */
}

/* Desktop: two columns */
@media (min-width: 768px) {
  .grid {
    grid-template-columns: 1fr 1fr;
  }
}

/* Panel styling */
.panel {
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.01));
  border-radius: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,.4);
  overflow: hidden;
  border: 1px solid var(--border);
  backdrop-filter: blur(14px);
  transition: transform 0.3s, box-shadow 0.3s;
  animation: floatFade 2s ease infinite alternate, fadeIn 1s ease forwards;
  opacity: 0;
}

.panel:hover {
  transform: translateY(-5px);
  box-shadow: 0 30px 50px rgba(0,0,0,.5);
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 24px;
}

/* Footer */
footer {
  margin: 0 20px 20px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
  border-top: 3px solid var(--orange-accent);
  padding: 16px 20px;
  text-align: center;
  font-size: 1.2rem;
  font-weight: 500;
  box-shadow: 0 12px 25px rgba(0,0,0,.4);
  animation: fadeInUp 1.2s ease forwards;
  opacity: 0;
}

/* Animations */
@keyframes floatFade {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-6px); }
}

@keyframes fadeIn {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Mobile tweaks */
@media (max-width: 480px) {
  header {
    padding: 16px;
    font-size: 1.4rem;
  }
  footer {
    padding: 12px 16px;
    font-size: 1rem;
  }
}
</style>
</head>

<body>

<header>
Hello 👋 — Welcome to Johnny’s Live Dashboard
</header>

<div class="grid">

  <!-- Random Delta A220 flight -->
  <div class="panel">
    <iframe id="flightFrame" loading="lazy"></iframe>
  </div>

  <!-- NOAA Weather Radar zoomed on New England -->
  <div class="panel">
    <iframe 
      src="https://radar.weather.gov/?extent=41.5,-73.5,44.5,-69.5" 
      loading="lazy">
    </iframe>
  </div>

</div>

<footer id="verse"></footer>

<script>
// List of example Delta A220 flights (replace with actual active flights)
const deltaFlights = [
  "https://flightaware.com/live/flight/DAL101",
  "https://flightaware.com/live/flight/DAL102",
  "https://flightaware.com/live/flight/DAL103",
  "https://flightaware.com/live/flight/DAL104",
  "https://flightaware.com/live/flight/DAL105",
  "https://flightaware.com/live/flight/DAL106",
  "https://flightaware.com/live/flight/DAL107",
  "https://flightaware.com/live/flight/DAL108",
  "https://flightaware.com/live/flight/DAL109",
  "https://flightaware.com/live/flight/DAL110",
  "https://flightaware.com/live/flight/DAL111",
  "https://flightaware.com/live/flight/DAL112",
  "https://flightaware.com/live/flight/DAL113",
  "https://flightaware.com/live/flight/DAL114",
  "https://flightaware.com/live/flight/DAL115",
  "https://flightaware.com/live/flight/DAL116",
  "https://flightaware.com/live/flight/DAL117",
  "https://flightaware.com/live/flight/DAL118",
  "https://flightaware.com/live/flight/DAL119",
  "https://flightaware.com/live/flight/DAL120"
];

// Pick a random flight each page load
const flightUrl = deltaFlights[Math.floor(Math.random() * deltaFlights.length)];
document.getElementById("flightFrame").src = flightUrl;

// Rotating Bible verses
const verses = [
  "“The Lord is my shepherd; I shall not want.” — Psalm 23:1",
  "“For I know the plans I have for you…” — Jeremiah 29:11",
  "“Be still, and know that I am God.” — Psalm 46:10",
  "“Trust in the Lord with all your heart.” — Proverbs 3:5",
  "“The Lord will watch over your coming and going.” — Psalm 121:8",
  "“I can do all things through Christ who strengthens me.” — Philippians 4:13"
];

function setVerse() {
  const v = verses[Math.floor(Math.random() * verses.length)];
  document.getElementById("verse").textContent = v;
}

setVerse();
setInterval(setVerse, 60000); // rotate every minute
</script>

</body>
</html>
