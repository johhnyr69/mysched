<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Welcome</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  .hero {
    position: relative;
    height: 100%;
    width: 100%;
    background: linear-gradient(#87c9ff, #e9f6ff);
    overflow: hidden;
  }

  .welcome {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    backdrop-filter: blur(2px);
    background: rgba(0,0,0,0.25);
    color: white;
    z-index: 2;
  }

  .welcome h1 {
    font-size: clamp(3rem, 6vw, 6rem);
    letter-spacing: 0.1em;
    margin: 0;
  }

  .welcome p {
    font-size: 1.3rem;
    opacity: 0.85;
    margin-top: 12px;
  }

  svg {
    position: absolute;
    width: 100%;
    height: 100%;
    bottom: -10%;
    left: 0;
  }
</style>
</head>
<body>

<div class="hero">

  <div class="welcome">
    <div>
      <h1>WELCOME</h1>
      <p>The Johnny Family Newsletter</p>
    </div>
  </div>

  <!-- Stylized JetBlue A320 -->
  <svg viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet">
    <!-- plane body -->
    <ellipse cx="600" cy="260" rx="420" ry="60" fill="#ffffff"/>
    <!-- nose -->
    <ellipse cx="180" cy="260" rx="90" ry="55" fill="#ffffff"/>
    <!-- cockpit -->
    <ellipse cx="155" cy="245" rx="30" ry="20" fill="#1c4fa1"/>

    <!-- tail -->
    <polygon points="930,260 1020,170 1040,180 980,260" fill="#1c4fa1"/>
    <polygon points="930,260 1020,350 1040,340 980,260" fill="#1c4fa1"/>

    <!-- wings -->
    <polygon points="520,260 700,350 740,350 620,260" fill="#d6e6ff"/>
    <polygon points="520,260 700,170 740,170 620,260" fill="#d6e6ff"/>

    <!-- engines -->
    <ellipse cx="600" cy="320" rx="35" ry="18" fill="#1c4fa1"/>
    <ellipse cx="650" cy="320" rx="35" ry="18" fill="#1c4fa1"/>

    <!-- jetblue stripe -->
    <rect x="250" y="260" width="600" height="18" fill="#1c4fa1"/>
    <text x="520" y="275" fill="white" font-size="22" font-weight="bold">jetBlue</text>

    <!-- windows -->
    <g fill="#1c4fa1">
      <circle cx="300" cy="250" r="6"/>
      <circle cx="340" cy="250" r="6"/>
      <circle cx="380" cy="250" r="6"/>
      <circle cx="420" cy="250" r="6"/>
      <circle cx="460" cy="250" r="6"/>
      <circle cx="500" cy="250" r="6"/>
      <circle cx="540" cy="250" r="6"/>
      <circle cx="580" cy="250" r="6"/>
      <circle cx="620" cy="250" r="6"/>
      <circle cx="660" cy="250" r="6"/>
      <circle cx="700" cy="250" r="6"/>
      <circle cx="740" cy="250" r="6"/>
      <circle cx="780" cy="250" r="6"/>
      <circle cx="820" cy="250" r="6"/>
    </g>
  </svg>

</div>

</body>
</html>
