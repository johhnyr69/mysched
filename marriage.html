<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Private Fun 😏</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background:#0b0b0b;
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

#gate, #app {
  text-align:center;
}

input, button {
  padding:12px 18px;
  font-size:18px;
  border-radius:10px;
  border:none;
  outline:none;
}

button {
  background:#ff3b6a;
  color:white;
  cursor:pointer;
  margin-top:15px;
}

button:hover {
  background:#ff5c85;
}

#countdown {
  font-size:32px;
  margin-bottom:20px;
}

.card {
  width:320px;
  height:240px;
  perspective:1000px;
  margin:20px auto;
}

.card-inner {
  width:100%;
  height:100%;
  transition:transform 0.8s;
  transform-style:preserve-3d;
  position:relative;
}

.card.flip .card-inner {
  transform:rotateY(180deg);
}

.face {
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  padding:20px;
  box-shadow:0 0 30px rgba(255,80,120,0.4);
}

.front {
  background:linear-gradient(135deg,#ff3b6a,#ff7a9c);
}

.back {
  background:linear-gradient(135deg,#222,#000);
  transform:rotateY(180deg);
  font-size:36px;
}
</style>
</head>

<body>

<div id="gate">
  <h2>Enter Password</h2>
  <input id="pw" type="password" placeholder="•••••">
  <br>
  <button onclick="unlock()">Unlock</button>
</div>

<div id="app" style="display:none;">
  <div id="countdown"></div>

  <div class="card" id="card">
    <div class="card-inner">
      <div class="face front" id="front"></div>
      <div class="face back" id="back">✨</div>
    </div>
  </div>

  <button onclick="next()">Next</button>
</div>

<script>

    startCountdown();
  } else {

}

  {text:"Pee on Floor 🚿💦", icon:"🚿💦"},
  {text:"Pee in Cup 🥤💦", icon:"🥤💦"},
  {text:"Pee in Pants 👖💦", icon:"👖💦"},
  {text:"Hardcore Sex 🔥💥", icon:"🔥💥"}

let current;

// Countdown
function startCountdown() {
  let t = 5;

  c.textContent = "Get ready… " + t;
  const timer = setInterval(()=>{
    t--;
    if(t <= 0){
      clearInterval(timer);
      c.textContent = "";
      draw();

// Pick random
function draw(){

function next(){

}
</script>

</body>
</html>
