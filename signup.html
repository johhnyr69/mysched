<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Join the Updates</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --jb-blue:#1f8fc7;
  --jb-light:#d7effb;
  --jb-dark:#083a5a;
}

*{ box-sizing:border-box; }

html,body{
  height:100%;
  margin:0;
}

body{
  background:linear-gradient(180deg,#d9f1fb,#b9e2f5);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--jb-dark);
}

.card{
  background:white;
  padding:40px;
  border-radius:22px;
  width:100%;
  max-width:420px;
  box-shadow:0 20px 40px rgba(0,0,0,.12);
  border:1px solid #bcdff2;
}

h1{
  text-align:center;
  margin-top:0;
  letter-spacing:.04em;
}

p{
  text-align:center;
  color:#245a7a;
}

form{
  margin-top:30px;
  display:grid;
  gap:18px;
}

input{
  padding:14px 16px;
  font-size:16px;
  border-radius:12px;
  border:1px solid #b7def3;
  background:#f3fbff;
}

button{
  margin-top:10px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#1f8fc7,#4bb7ee);
  color:white;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

small{
  text-align:center;
  display:block;
  margin-top:15px;
  color:#4a7c9b;
}
</style>
</head>

<body>

<div class="card">
  <h1>Join the Family Updates</h1>
  <p>Get weekly notes, photos, and life updates.</p>

  <form action="https://formspree.io/f/YOUR_F/xkoonedv" method="POST">
    <input type="text" name="name" placeholder="Your name" required>
    <input type="email" name="email" placeholder="Your email" required>

    <button type="submit">Join</button>
  </form>

  <small>We never share or sell your email.</small>
</div>

</body>
</html>
